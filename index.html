<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="2026 익산 NS푸드페스타 식생활안전관리원 식생활 퀴즈 캠페인">
    <title>삼삼한 밥상 퀴즈 | 2026 NS푸드페스타</title>
    <link rel="stylesheet" href="style.css">
    <!-- 오답 및 참여 완료 팝업 전용 스타일 -->
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- 상단 영역: 기관 로고(왼쪽)와 행사명(오른쪽) -->
    <header>
      <div class="inner">
        <!-- 기관 로고 위치: style.css의 header .inner와 .brand에서 조절
             로고 파일: questions.js의 ORG_LOGO에 assets/org-logo.png 지정
             orgLogo/orgName의 id는 JavaScript에서 사용하므로 유지하세요. -->
        <div class="brand">
          <img id="orgLogo" alt="식생활안전관리원" hidden>
          <span id="orgName">식생활안전관리원</span>
        </div>
        <!-- 오른쪽 행사명: 아래 문구를 직접 수정할 수 있습니다. -->
        <div class="event-mark">2026년 NS푸드페스타<span>2026. 10. 16.(금)~10. 17.(토)</span>
        </div>
      </div>
    </header>
    <main>

      <!-- 모바일 메인 화면: 위쪽 포스터, 아래쪽 시작 버튼 -->
      <section class="landing" id="landing" aria-label="삼삼한 밥상 퀴즈 안내">
        <!-- 포스터 위치/높이: style.css의 .poster와 --poster-height 수정
             포스터 교체: 아래 src 경로 변경
             이미지 설명: alt를 새 포스터 내용에 맞게 수정 -->
        <div class="poster">
          <img src="assets/poster3.png" alt="NS푸드페스타 2026 익산 공식 포스터. 10월 16일부터 17일까지, 하림 퍼스트키친." width="443" height="627">
        </div>
        <!-- 하단 시작 영역: 여백과 글자 크기는 style.css의 .intro에서 수정 -->
        <div class="intro">
          <!--<span class="tag"></span>-->
          <!-- 메인 제목: 문구를 직접 수정할 수 있습니다. -->

          <!-- 시작 버튼: 문구는 수정 가능, id="start"는 유지하세요. -->
           <div class="quiz-characters" aria-hidden="true"></div>
            <!--<img src="assets/character1.png" alt="캐릭터 1">-->
            <h3>케어루 & 나슈로와 함께하는 삼삼한 밥상 퀴즈</h3>
            <!--<img src="assets/character2.png" alt="캐릭터 2">-->
          <button class="primary" id="start">퀴즈 참가하기</button>
        <p>퀴즈를 풀고 진행요원에게 보여주세요! 상품이 기다리고 있어요!</p>
          </div>
        </div>
      </section>

      <!-- 퀴즈 화면: 문항은 questions.js에서 수정, 아래 id는 유지 -->
      <section class="quiz" id="quiz" hidden aria-labelledby="question" tabindex="-1">

      
        <div class="quiz-head">
          <button class="text-button" id="home">처음으로</button>
        </div>


        <div class="progress" role="progressbar" aria-label="문항 진행" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1">
          <div id="bar"></div>
        </div>
        <div class="eyebrow" id="counter"></div>
        <h2 id="question"></h2>
        <div class="options" id="options" role="group" aria-labelledby="question"></div>
        <div class="nav">
          <button class="secondary" id="back">이전</button>
          <button class="primary" id="next" disabled>다음 문항</button>
        </div>
      </section>
    </main>


    <!-- 하단 운영기관/참여 안내 문구 -->
    <!--<footer>캠페인 운영 · 식생활안전관리원<br>이름이나 연락처를 입력하지 않고 참여할 수 있어요.</footer>-->
    <!-- 오답 팝업: 닫으면 같은 문항을 다시 풀 수 있습니다. -->
    <dialog id="wrongAnswer" aria-labelledby="wrongTitle">
      <div class="result-top">
        <h2 id="wrongTitle">다시 도전해 주세요!</h2>
        <p>아쉽지만 정답이 아니에요.<br>다른 보기를 선택해 보세요!</p>
      </div>
      <button class="primary popup-button" id="tryAgain">다시 풀기</button>
    </dialog>

    <!-- 정답 팝업: 해설은 questions.js의 각 문항 explanation에서 가져옵니다. -->
    <dialog id="correctAnswer" aria-labelledby="correctTitle" aria-describedby="correctExplanation">
      <div class="result-top">
        <span class="tag">잘 맞혔어요!</span>
        <h2 id="correctTitle">정답입니다!</h2>
        <p id="correctExplanation" class="correct-explanation"></p>
      </div>
      <button class="primary popup-button" id="continueQuiz">다음 문항으로</button>
    </dialog>

    <!-- 최종 완료 팝업: 점수 없이 상품 수령 안내만 표시 -->
    <dialog id="result" aria-labelledby="resultTitle">
      <div class="result-top">
        <!-- 완료 그림: questions.js의 COMPLETION_IMAGE에서 파일 경로 지정
             예: assets/complete.png. 지정하지 않으면 이미지 영역은 숨깁니다. -->
        <img id="completionImage" class="completion-image" alt="퀴즈 참여 완료 축하 이미지" hidden>
        <!-- 아래 제목과 상품 안내 문구를 직접 수정하세요. -->
        <h2 id="resultTitle">고생하셨습니다.<br> 참여해주셔서 감사합니다.</h2>
        <p class="prize-message">현장 진행요원에게 본 화면을 보여주시면 상품을 드립니다!</p>
      </div>
      <button class="secondary popup-button" id="close">메인으로 돌아가기</button>
    </dialog>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
